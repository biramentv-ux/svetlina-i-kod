# Сглобява школата в един HTML файл и я публикува в GitHub Pages и в IPFS.
name: Сглобяване и публикуване

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.ipfs.outputs.cid }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Сглобяване (scripts/build.sh)
        run: bash scripts/build.sh
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shkola.dyrakarmy.eu/' }}
      - name: Папка за публикуване
        run: |
          mkdir -p site
          cp deploy/index.html site/index.html
          cp deploy/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # IPFS: детерминиран CID и CAR файл; закачане (pin) към собствен Kubo възел, ако са зададени тайните
      - id: ipfs
        uses: ipfs/ipfs-deploy-action@v3
        with:
          path-to-deploy: site
          github-token: ${{ github.token }}
          kubo-api-url: ${{ secrets.KUBO_API_URL }}
          kubo-api-auth: ${{ secrets.KUBO_API_AUTH }}
      - name: CID в обобщението
        run: |
          echo "### IPFS" >> "$GITHUB_STEP_SUMMARY"
          echo "CID: \`${{ steps.ipfs.outputs.cid }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "DNSLink запис: \`_dnslink.shkola.dyrakarmy.eu TXT dnslink=/ipfs/${{ steps.ipfs.outputs.cid }}\`" >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
